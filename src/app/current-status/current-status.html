<div>
    <p class="header-text">CURRENT WEIGHT</p>

    <div>
        @if (currentWeight()) {
            <span class="weight-value">
                {{ convertedWeight()?.weight | number: '1.0-1' }}
            </span>
        } @else {
            <span class="weight-value"> &mdash; </span>
        }

        <span class="weight-unit">
            {{ convertedWeight()?.unit }}
        </span>
    </div>
    <div>
        @if (currentWeight()) {
            <p class="last-recorded">
                Last recorded {{ currentWeight()?.date | date: 'mediumDate' }}
            </p>
        } @else {
            <p class="last-recorded">No measurements recorded yet</p>
        }
    </div>
</div>
