<app-title></app-title>

    <app-current-status
        [currentWeight]="mostRecentEntry"
        [currentUnit]="currentUnit"
    >
    </app-current-status>


<div class="chart-area">
    @if (entries().length === 0) {
        <div class="empty-chart-message-container">
            <p class="add-weight-message">Add your first weight to see your progress!</p>
        </div>
    } @else {
        <app-weight-chart
            [entries]="entries()"
            (selectedEntry)="selectedEntry = $event"
        />
    }
</div>

<div class="log-weight-message">Log weight</div>

<app-weight-input-form />

<app-weight-entry-detail
    [selectedEntry]="selectedEntry"
    (toDelete)="onDelete($event)"
></app-weight-entry-detail>
