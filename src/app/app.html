<header>
    <div class="header-summary">
        <app-title></app-title>
        <app-current-status
            [currentUnit]="currentUnit()"
        >
        </app-current-status>
    </div>

    <app-unit-switch
        [currentUnit]="currentUnit()"
        (unitChange)="onUnitChange($event)"
    ></app-unit-switch>
</header>

<div class="chart-area">
    @if (entries().length === 0) {
        <div class="empty-chart-message-container">
            <p class="add-weight-message">Add your first weight to see your progress!</p>
        </div>
    } @else {
        <app-weight-chart
            [entries]="entries()"
            (selectedEntry)="selectedDate.set($event.date)"
            [currentUnit]="currentUnit()"
        />
    }
</div>

<div class="log-weight-message">Log weight</div>

<app-weight-input-form />

<app-weight-entry-detail
    [selectedEntry]="selectedEntry()"
    [currentUnit]="currentUnit()"
    (toDelete)="onDelete($event)"
></app-weight-entry-detail>
