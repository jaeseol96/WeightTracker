<form
    id="inputForm"
    (ngSubmit)="onSubmit()"
>
    <div class="input-container">
        <div class="date-input-container">
            <button
                type="button"
                class="btn date-select-button"
                (click)="openDatePicker()"
            >
                <svg
                    lucideCalendarDays
                    [size]="16"
                    [strokeWidth]="1.5"
                ></svg>
                @if (isToday) {
                    Today
                } @else {
                    {{ selectedDate | date: 'M/d' }}
                }
            </button>
            <input
                type="date"
                tabindex="-1"
                class="date-picker-input"
                [value]="selectedDate"
                id="inputDate"
                #dateInput
                (change)="onDateChange(dateInput.value)"
            />
        </div>

        <input
            class="weight-value-input"
            placeholder="Weight"
            aria-label="Weight"
            type="number"
            step="0.1"
            min="0"
            inputmode="decimal"
            [(ngModel)]="weight"
            id="inputWeight"
            name="weight"
            required
        />
        <select
            class="btn unit-selector"
            aria-label="unit"
            name="unit"
            [(ngModel)]="selectedUnit"
        >
            <option value="lb">lb</option>
            <option value="kg">kg</option>
        </select>
        <button
            type="submit"
            class="btn submit-weight-button"
        >
            Save Weight
        </button>
    </div>
</form>
