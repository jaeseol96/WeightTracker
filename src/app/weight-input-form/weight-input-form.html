<form
    id="inputForm"
    (ngSubmit)="onSubmit()"
>
    <label for="inputWeight">Enter weight for </label>
    <button
        type="button"
        (click)="openDatePicker()"
    >
        {{ selectedDate | date: 'M/d' }}
    </button>
    <input
        type="date"
        class="date-picker-input"
        [value]="selectedDate | date: 'yyyy-MM-dd'"
        id="inputDate"
        #dateInput
        (change)="onDateChange(dateInput.value)"
    />
    <input
        type="number"
        step="0.1"
        min="0"
        inputmode="decimal"
        [(ngModel)]="weight"
        id="inputWeight"
        name="weight"
        required
    />
    <button type="submit">Save Weight</button>
</form>
