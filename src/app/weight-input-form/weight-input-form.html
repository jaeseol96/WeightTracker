<form
    id="inputForm"
    (ngSubmit)="onSubmit()"
>
    <div
        class="input-container"
        >
<!--        <label for="inputWeight">Enter weight for </label>-->
        <button
            type="button"
            class="btn date-select-button"
            (click)="openDatePicker()"
        >
            {{ selectedDate | date: 'M/d' }}
        </button>
        <input
            type="date"
            class="date-picker-input"
            [value]="selectedDate | date: 'yyyy-MM-dd'"
            id="inputDate"
            #dateInput
            (change)="onDateChange(dateInput.value)"
        />
        <input
            class="weight-value-input"
            aria-label="Weight"
            type="number"
            step="0.1"
            min="0"
            inputmode="decimal"
            [(ngModel)]="weight"
            id="inputWeight"
            name="weight"
            required
        />
        <select
            class="btn unit-selector"
            aria-label="unit"
            name="unit"
            [(ngModel)]="selectedUnit"
            >
            <option value="lb">lb</option>
            <option value="kg">kg</option>
        </select>
        <button
            type="submit"
            class="btn submit-weight-button"
        >Save Weight</button>
    </div>

</form>
