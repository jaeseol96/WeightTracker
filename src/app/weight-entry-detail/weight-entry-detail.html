<div class="weight-entry-detail-container">
    @if (selectedEntry()) {
        <div class="header-text">Weight entry</div>
        <div class="date">{{ selectedEntry()?.date | date: 'longDate' }}</div>
        <div id="value-unit-row">
            <span class="weight-value">
                {{ selectedEntry()?.weight }}
            </span>
            <span class="weight-unit">
                {{ selectedEntry()?.unit }}
            </span>
        </div>
        <div class="button-row">
            <button class="btn edit">
                <svg
                    class="btn-icon"
                    lucideSquarePen
                ></svg>
                Edit
            </button>
            <button
                class="btn delete"
                (click)="onDelete()"
            >
                <svg
                    class="btn-icon"
                    lucideTrash
                ></svg>
                Delete
            </button>
        </div>
    } @else {
        <div class="no-selection-message">
            <svg
                class="btn-icon click"
                lucideMousePointerClick
            ></svg>
            Select a point on the chart to view or manage it.
        </div>
    }
</div>
